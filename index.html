<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Mini-Obby 2D</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #19171d;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        h1 {
            color: #00a2ff;
            margin-bottom: 10px;
            text-shadow: 2px 2px #000;
        }
        p {
            margin-bottom: 15px;
            color: #cccccc;
        }
        #gameCanvas {
            background-color: #6eb5ff;
            border: 4px solid #ffffff;
            border-radius: 8px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }
        .controls {
            margin-top: 15px;
            background: #2b2d31;
            padding: 10px 20px;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Roblox Web Obby 2D</h1>
    <p>Lompat merentasi blok merah untuk sampai ke Garisan Penamat (Kuning)!</p>

    <canvas id="gameCanvas" width="800" height="400"></canvas>

    <div class="controls">
        <strong>Kawalan:</strong> Gunakan Arrow Left/Right atau [A]/[D] untuk bergerak, [Space] / Arrow Up / [W] untuk Lompat.
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Pembolehubah Game
        let player = {
            x: 50,
            y: 300,
            width: 30,
            height: 30,
            color: '#e2231a', // Warna Roblox Red
            dx: 0,
            dy: 0,
            speed: 4,
            jumpPower: -10,
            gravity: 0.5,
            isGrounded: false
        };

        // Platform & Halangan (Lava Merah)
        const platforms = [
            { x: 0, y: 350, width: 150, height: 50, color: '#555' }, // Start
            { x: 200, y: 300, width: 100, height: 20, color: '#555' },
            { x: 350, y: 250, width: 80, height: 20, color: '#555' },
            { x: 480, y: 200, width: 100, height: 20, color: '#555' },
            { x: 650, y: 150, width: 120, height: 20, color: '#ffcc00' } // Goal/Finish
        ];

        const hazards = [
            { x: 150, y: 380, width: 650, height: 20, color: '#ff0000' }, // Lava bawah
            { x: 230, y: 280, width: 40, height: 20, color: '#ff0000' }   // Lava atas platform
        ];

        let keys = {};

        // Event Listener Kawalan
        window.addEventListener('keydown', (e) => keys[e.key] = true);
        window.addEventListener('keyup', (e) => keys[e.key] = false);

        function resetGame() {
            player.x = 50;
            player.y = 300;
            player.dx = 0;
            player.dy = 0;
        }

        function update() {
            // Pergerakan Kiri / Kanan
            if (keys['ArrowRight'] || keys['d'] || keys['D']) {
                player.dx = player.speed;
            } else if (keys['ArrowLeft'] || keys['a'] || keys['A']) {
                player.dx = -player.speed;
            } else {
                player.dx = 0;
            }

            // Lompat
            if ((keys['Space'] || keys['ArrowUp'] || keys['w'] || keys['W']) && player.isGrounded) {
                player.dy = player.jumpPower;
                player.isGrounded = false;
            }

            // Tarikan Graviti
            player.dy += player.gravity;

            // Kemaskini Kedudukan
            player.x += player.dx;
            player.y += player.dy;

            // Semakan Perlanggaran dengan Platform
            player.isGrounded = false;
            platforms.forEach(plat => {
                if (
                    player.x < plat.x + plat.width &&
                    player.x + player.width > plat.x &&
                    player.y + player.height <= plat.y + player.dy + 5 &&
                    player.y + player.height >= plat.y
                ) {
                    player.dy = 0;
                    player.y = plat.y - player.height;
                    player.isGrounded = true;

                    // Semak jika sampai garisan penamat
                    if (plat.color === '#ffcc00') {
                        alert('Tahniah! Anda telah berjaya menyelesaikan Obby!');
                        resetGame();
                    }
                }
            });

            // Semakan Perlanggaran dengan Lava (Kematian)
            hazards.forEach(hazard => {
                if (
                    player.x < hazard.x + hazard.width &&
                    player.x + player.width > hazard.x &&
                    player.y < hazard.y + hazard.height &&
                    player.y + player.height > hazard.y
                ) {
                    resetGame(); // Mati & Semula
                }
            });

            // Sempadan Skrin
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            if (player.y > canvas.height) resetGame();
        }

        function draw() {
            // Bersihkan Canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Lukis Platform
            platforms.forEach(plat => {
                ctx.fillStyle = plat.color;
                ctx.fillRect(plat.x, plat.y, plat.width, plat.height);
            });

            // Lukis Lava / Halangan
            hazards.forEach(hazard => {
                ctx.fillStyle = hazard.color;
                ctx.fillRect(hazard.x, hazard.y, hazard.width, hazard.height);
            });

            // Lukis Pemain (Avatar Roblox Blocky)
            ctx.fillStyle = player.color;
            ctx.fillRect(player.x, player.y, player.width, player.height);
            // Lukis Muka Avatar
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(player.x + 6, player.y + 6, 5, 5); // Mata Kiri
            ctx.fillRect(player.x + 18, player.y + 6, 5, 5); // Mata Kanan
            ctx.fillRect(player.x + 8, player.y + 18, 14, 4); // Senyuman
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
